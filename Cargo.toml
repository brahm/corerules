[workspace]
resolver = "3"
members = ["crates/cr-i18n", "crates/cr-formats", "crates/cr-store", "crates/cr-cli", "crates/cr-gtk", "crates/cr-addons"]
# The add-ons installer carries 9 MB of add-ons; only its own AppImage
# builds it (cargo build -p cr-addons).
default-members = ["crates/cr-i18n", "crates/cr-formats", "crates/cr-store", "crates/cr-cli", "crates/cr-gtk"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/brahm/corerules"
rust-version = "1.88"

[workspace.dependencies]
cr-formats = { path = "crates/cr-formats" }
cr-store = { path = "crates/cr-store" }
cr-i18n = { path = "crates/cr-i18n" }
encoding_rs = "0.8"
thiserror = "2"
