name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - "addons/screenshots/**"
      - "packaging/flatpak/repo.sh"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "packaging/flatpak/repo.sh"
      - ".github/workflows/pages.yml"
  # The Packages workflow runs this after each final release, so the
  # Flatpak repository gets the new version.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/build.py _site
      - run: sudo apt-get update && sudo apt-get install -y flatpak ostree
      # The Flatpak repository is signed with the key in the
      # FLATPAK_GPG_PRIVATE_KEY secret. A pull request without the secret
      # signs with a throwaway key, to test the rest; the site is never
      # published without it.
      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gpg --batch --passphrase '' --quick-gen-key 'Core Rules test key' rsa4096 sign never
          else
            echo "::error::The FLATPAK_GPG_PRIVATE_KEY secret is missing"
            exit 1
          fi
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      # The repository holds the .flatpak of the latest release.
      - name: Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'CoreRules-[0-9]*.flatpak' --dir "$RUNNER_TEMP/release"
          packaging/flatpak/repo.sh "$RUNNER_TEMP"/release/CoreRules-*.flatpak _site https://brahm.github.io/corerules "$KEY_ID"
      - name: Check the repository
        run: |
          gpg --export "$KEY_ID" > "$RUNNER_TEMP/key.gpg"
          flatpak remote-add --user --gpg-import="$RUNNER_TEMP/key.gpg" check "file://$PWD/_site/flatpak"
          flatpak remote-ls --user check --columns=application,branch,commit | tee "$RUNNER_TEMP/apps"
          grep -q '^io.github.brahm.CoreRules' "$RUNNER_TEMP/apps"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
