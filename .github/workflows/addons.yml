name: Addons package

# Builds the Core Rules Community Add-ons Collection as one .zip
# (addons/tools/addons_zip.py) for Import Add-ons… in the app, on Linux,
# Windows and macOS: Comunidade.xpx with the pictures, pictures.tsv and the
# texts. On main or by hand it publishes the zip on the release "addons",
# whose tag follows main: there CoreRules-Community-Addons.zip is always the
# newest, for a download link that does not change.
on:
  push:
    branches: [main]
    paths:
      - 'addons/**'
      - '.github/workflows/addons.yml'
  pull_request:
    paths:
      - 'addons/**'
      - '.github/workflows/addons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - run: python3 -I addons/tools/addons_zip.py ${{ steps.v.outputs.version }} dist
      - name: Check the zip
        run: |
          zip=dist/CoreRules-Community-Addons-${{ steps.v.outputs.version }}.zip
          unzip -tq "$zip"
          unzip -l "$zip" | grep -q 'Comunidade.xpx$'
          test "$(unzip -l "$zip" | grep -ci '\.bmp$')" -ge 600
          cp "$zip" dist/CoreRules-Community-Addons.zip
          (cd dist && sha256sum *.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: addons-zip
          path: dist/CoreRules-Community-Addons-${{ steps.v.outputs.version }}.zip
      - if: github.event_name != 'pull_request'
        name: Move the addons tag to this commit
        uses: actions/github-script@v7
        with:
          script: |
            const ref = { owner: context.repo.owner, repo: context.repo.repo };
            try {
              await github.rest.git.updateRef({ ...ref, ref: 'tags/addons', sha: context.sha, force: true });
            } catch (e) {
              if (e.status !== 422 && e.status !== 404) throw e;
              await github.rest.git.createRef({ ...ref, ref: 'refs/tags/addons', sha: context.sha });
            }
      - if: github.event_name != 'pull_request'
        name: Publish on the addons release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addons
          name: Core Rules Community Add-ons Collection
          make_latest: false
          body: |
            The [Core Rules Community Add-ons Collection](https://github.com/brahm/corerules/blob/main/addons/README.md) as one .zip, built with Core Rules ${{ steps.v.outputs.version }}: 672 community add-ons in 36,525 items, with their 668 pictures and their authors' texts.

            Download **CoreRules-Community-Addons.zip** (always the newest; the file with a version in its name is the same build), then, on Linux, Windows or macOS:

            1. Put the zip in a folder of its own. There is no need to extract it.
            2. In Core Rules, choose **Import Add-ons…** (the main menu on Linux, the More menu on Windows, the File menu on the Mac) and pick that folder.
            3. Check the list of what comes in and press **Import**. The app backs up `UserDbas` and `Chars` first.

            The original Expansion program can import its `Comunidade.xpx` too.

            Direct link: https://github.com/${{ github.repository }}/releases/download/addons/CoreRules-Community-Addons.zip

            The app itself is on the [Core Rules releases](https://github.com/${{ github.repository }}/releases).
          files: |
            dist/CoreRules-Community-Addons.zip
            dist/CoreRules-Community-Addons-${{ steps.v.outputs.version }}.zip
