name: Packages

# Builds the .deb, .rpm, pacman, Flatpak and AppImage packages and the
# MSIX for the Microsoft Store, installs each one on a clean system and
# starts the app there. Pushing a v* tag (or running the
# workflow by hand with a tag) also publishes them as a GitHub release.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'crates/cr-win/package/**'
      - 'data/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, created on this commit if missing (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          case "$tag" in
            v[0-9]*) version=${tag#v} ;;
            *) version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1); tag= ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The .deb is built on Ubuntu 26.04, the release it targets.
  deb:
    needs: version
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: apt-get update && apt-get install -y build-essential curl ca-certificates git pkg-config libgtk-4-dev libadwaita-1-dev dpkg-dev file
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: packaging/deb/build.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  # The AppImage is built inside the GNOME 51 SDK and bundles its GTK,
  # libadwaita and the rest of the GNOME 51 libraries, like the Flatpak.
  appimage:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # The checkout belongs to the runner's user; root inside the SDK
      # sandbox has no capabilities to write there.
      - run: chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
      - run: packaging/appimage/build-in-sdk.sh ${{ needs.version.outputs.version }}
      - run: |
          # The newest glibc symbol it needs, which the release notes name.
          cd target/AppDir && find . -type f \( -name '*.so*' -o -path '*/bin/*' \) -exec objdump -T {} + 2>/dev/null |
            grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  rpm:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - run: dnf install -y git rpm-build cargo rust gcc gtk4-devel libadwaita-devel desktop-file-utils libappstream-glib
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$PWD"
      - run: packaging/rpm/build.sh ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm

  # Arch Linux is a rolling release, so the package is built on the current
  # Arch and installs on it and on the distributions that follow it
  # (CachyOS, Omarchy). makepkg refuses to run as root.
  arch:
    needs: version
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git cargo gtk4 libadwaita desktop-file-utils appstream-glib
      - uses: actions/checkout@v4
      - run: |
          useradd -m builder
          chown -R builder "$PWD"
          su builder -c "git config --global --add safe.directory '$PWD' && packaging/arch/build.sh ${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/PKGBUILD

  flatpak:
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      # With the FLATPAK_GPG_PRIVATE_KEY secret, the build is signed and the
      # bundle names the website's Flatpak repository and its key, so
      # installing the .flatpak also brings the updates published there.
      - name: Signing key
        env:
          SIGNING_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            command -v gpg >/dev/null || dnf install -y gnupg2
            printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
            echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
          fi
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.brahm.CoreRules.yml
          cache-key: flatpak-builder-${{ github.sha }}
          gpg-sign: ${{ env.KEY_ID }}
          build-bundle: false
          upload-artifact: false
      - name: Bundle
        run: |
          set -- --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          if [ -n "${KEY_ID:-}" ]; then
            gpg --export "$KEY_ID" > "$RUNNER_TEMP/key.gpg"
            set -- "$@" --repo-url=https://brahm.github.io/corerules/flatpak/ --gpg-keys="$RUNNER_TEMP/key.gpg"
          fi
          flatpak build-bundle "$@" repo CoreRules-${{ needs.version.outputs.version }}.flatpak io.github.brahm.CoreRules master
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: CoreRules-${{ needs.version.outputs.version }}.flatpak

  # Each package goes onto a clean container of the oldest and the newest
  # supported release, and the app has to start and keep running in each
  # interface language, with its texts in that language. Minimal
  # containers lack the Mesa drivers every desktop has, so the tests add them.
  # Ubuntu 26.10 and Fedora 45 are where users tested 1.0 before it was
  # released (ubuntu:latest is the LTS, fedora:latest lags a release).
  test-deb:
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:26.04', 'ubuntu:26.10', 'ubuntu:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - run: apt-get update && apt-get install -y ./corerules_*.deb xvfb xauth dbus
      - run: packaging/smoke-test.sh corerules
      - run: command -v cr && test -f /usr/share/icons/hicolor/256x256/apps/io.github.brahm.CoreRules.png

  # Ubuntu 24.04 is not supported: apt has to refuse the package there.
  refuse-deb:
    needs: deb
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
      - run: apt-get update
      - run: "! apt-get install -y ./corerules_*.deb"

  test-rpm:
    needs: rpm
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'fedora:45', 'fedora:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rpm
      - run: dnf install -y ./corerules-*.rpm xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools which mesa-dri-drivers mesa-libEGL mesa-libGLES
      - run: packaging/smoke-test.sh corerules
      - run: test -f /usr/share/icons/hicolor/256x256/apps/io.github.brahm.CoreRules.png

  # Omarchy is Arch Linux with its own desktop setup, so the Arch container
  # stands for it.
  test-arch:
    needs: arch
    strategy:
      fail-fast: false
      matrix:
        image: ['archlinux:latest', 'cachyos/cachyos:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arch
      - run: pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth dbus mesa
      - run: pacman -U --noconfirm ./corerules-*.pkg.tar.zst
      # The release candidate has to sort before the release.
      - run: test "$(vercmp 1.0.0rc1 1.0.0)" = -1
      - run: packaging/smoke-test.sh corerules
      - run: command -v cr && test -f /usr/share/icons/hicolor/256x256/apps/io.github.brahm.CoreRules.png

  # The AppImage brings GTK and libadwaita; the systems get only the
  # libraries AppImages leave to the host because every desktop has them
  # (linuxdeploy's excludelist: X, OpenGL, Wayland, fonts and text shaping).
  # FUSE is skipped by extract-and-run.
  test-appimage:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'ubuntu:26.04', 'fedora:45', 'ubuntu:26.10', 'fedora:latest', 'ubuntu:latest']
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - if: startsWith(matrix.image, 'fedora')
        run: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon dbus-tools which mesa-libEGL mesa-libGL mesa-libGLES mesa-libgbm mesa-dri-drivers libdrm libX11-xcb libwayland-client fontconfig freetype fribidi harfbuzz gmp libgpg-error libcom_err libstdc++ zlib-ng-compat dejavu-sans-fonts libxkbcommon shared-mime-info
      - if: startsWith(matrix.image, 'ubuntu')
        run: apt-get update && apt-get install -y xvfb xauth dbus libegl1 libgl1 libgles2 libgbm1 libgl1-mesa-dri libdrm2 libx11-xcb1 libwayland-client0 libfontconfig1 libfreetype6 libfribidi0 libharfbuzz0b libgmp10 libgpg-error0 libcom-err2 libstdc++6 zlib1g fonts-dejavu-core libxkbcommon0 shared-mime-info
      - run: chmod +x CoreRules-*.AppImage && packaging/smoke-test.sh ./CoreRules-*.AppImage

  test-flatpak:
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
      - run: sudo apt-get update && sudo apt-get install -y flatpak xvfb dbus
      - run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51
          flatpak install --user -y --noninteractive --bundle CoreRules-*.flatpak
      - run: packaging/smoke-test.sh flatpak run io.github.brahm.CoreRules

  # The MSIX package for the Microsoft Store, which signs it. The Store
  # wants a version of four numbers with the last 0, without a suffix.
  msix:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p cr-win
      - name: Package the MSIX
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}" -replace '-.*$', ''
          crates/cr-win/package/make-msix.ps1 -Version $version -Out dist
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix

  # Installs the package on a clean Windows with the Windows App Runtime
  # it needs, signed here with a certificate of its own publisher that
  # only this machine trusts, starts the app from Start and runs the
  # Windows App Certification Kit the Store runs.
  test-msix:
    needs: msix
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msix
          path: dist
      - name: Install the Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/2.5/2.5.1/windowsappruntimeinstall-x64.exe -OutFile runtime.exe
          ./runtime.exe --quiet
          if ($LASTEXITCODE -ne 0) { throw "the Windows App Runtime did not install" }
      - name: Install the package
        shell: pwsh
        run: |
          $package = Get-Item dist/*.msix
          $kit = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=E77E0DF5-5354-4DC5-B7EC-3E228FF5F8E9" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath test.cer | Out-Null
          Import-Certificate -FilePath test.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          & $kit.FullName sign /fd SHA256 /sha1 $cert.Thumbprint $package.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage $package.FullName
          Get-AppxPackage WagnerBrahm.CoreRules | Format-List Name, Version, PackageFamilyName, InstallLocation
      - name: Start the app
        shell: pwsh
        run: |
          $family = (Get-AppxPackage WagnerBrahm.CoreRules).PackageFamilyName
          Start-Process "shell:AppsFolder\$family!CoreRules"
          Start-Sleep 20
          $app = Get-Process CoreRules -ErrorAction SilentlyContinue
          if (-not $app) { throw "the app is not running 20 seconds after it started" }
          if (-not $app.MainWindowHandle) { throw "the app has no window" }
          Write-Output "running: $($app.MainWindowTitle)"
          Stop-Process -Name CoreRules
      - name: Windows App Certification Kit
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { throw "appcert.exe not found" }
          $package = (Get-Item dist/*.msix).FullName
          & $appcert reset
          & $appcert test -appxpackagepath $package -reportoutputpath "$PWD\wack.xml"
          [xml]$report = Get-Content wack.xml
          $failed = $report.REPORT.REQUIREMENTS.REQUIREMENT.TEST |
            Where-Object { $_.RESULT.'#cdata-section' -eq 'FAIL' }
          # A failed optional test leaves the result a WARNING, which the
          # Store takes; what it found shows here, as the report says it.
          $failed | ForEach-Object {
            Write-Output "FAIL: $($_.NAME)"
            $_.MESSAGES.MESSAGE | ForEach-Object { Write-Output "  $($_.TEXT)" }
            Write-Output $_.OuterXml
          }
          Write-Output "Overall: $($report.REPORT.OVERALL_RESULT)"
          if ($report.REPORT.OVERALL_RESULT -eq 'FAIL') { throw "the package fails certification" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wack-report
          path: wack.xml

  release:
    needs: [version, test-deb, refuse-deb, test-rpm, test-arch, test-appimage, test-flatpak, test-msix]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The MSIX goes to the Microsoft Store, not the release: unsigned,
      # Windows would not install it.
      - run: rm -f dist/*.msix dist/wack.xml
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # 0.x releases are betas; a -rc suffix is a release candidate.
          name: Core Rules ${{ needs.version.outputs.version }}${{ contains(needs.version.outputs.version, '-rc') && ' release candidate' || startsWith(needs.version.outputs.version, '0.') && ' beta' || '' }}
          body_path: packaging/release-notes.md
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') || contains(needs.version.outputs.version, '-') }}
          # A final release becomes the repository's latest release, which
          # the addons release never is.
          make_latest: ${{ !startsWith(needs.version.outputs.version, '0.') && !contains(needs.version.outputs.version, '-') }}
          files: dist/*

  # A final release becomes the version in the website's Flatpak
  # repository: the Landing page workflow republishes the site from main.
  # Releases made with this workflow's token start no workflows by
  # themselves, so it is started by hand here.
  website:
    needs: [version, release]
    if: ${{ !startsWith(needs.version.outputs.version, '0.') && !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
