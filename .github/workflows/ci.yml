name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The backend, `cr` and the Windows app on Windows; the GTK crates are
  # left out. The MSIX package is not signed (the Microsoft Store signs
  # it); its layout installs with Add-AppxPackage -Register.
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p cr-formats -p cr-store -p cr-i18n -p cr-app -p cr-cli -p cr-win --all-targets -- -D warnings
      - run: cargo test --no-fail-fast -p cr-formats -p cr-store -p cr-i18n -p cr-app -p cr-cli -p cr-win
      - run: cargo build --release -p cr-cli -p cr-win
      - name: Package the MSIX
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'cr-win' | ForEach-Object version
          crates/cr-win/package/make-msix.ps1 -Version $version -Out target/package
      - uses: actions/upload-artifact@v4
        with:
          name: cr-windows-x64
          path: target/release/cr.exe
      - uses: actions/upload-artifact@v4
        with:
          name: corerules-windows-x64
          path: |
            target/package/*.msix
            target/msix/

  # The backend, `cr` and the Mac app's bridge on an Apple Silicon Mac; the
  # GTK and Windows crates are left out. A Swift program calls the bridge
  # through its generated bindings.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p cr-formats -p cr-store -p cr-i18n -p cr-app -p cr-cli -p cr-mac-ffi --all-targets -- -D warnings
      - run: cargo test --no-fail-fast -p cr-formats -p cr-store -p cr-i18n -p cr-app -p cr-cli -p cr-mac-ffi
      - run: cargo build --release -p cr-cli
      - run: macos/scripts/make-bindings.sh
      - run: macos/scripts/smoke-test.sh
      - run: macos/scripts/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cr-macos-arm64
          path: target/release/cr
      - uses: actions/upload-artifact@v4
        with:
          name: CoreRules-macos-arm64-dmg
          path: target/macos/*.dmg
